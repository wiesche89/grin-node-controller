name: Build runtime releases

on:
  push:
    tags: ['mainnet-v*', 'testnet-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      network: ${{ steps.release.outputs.network }}
      sources: ${{ steps.release.outputs.sources }}
    steps:
      - uses: actions/checkout@v4
      - name: Read release config
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != tag || ! "$RELEASE_TAG" =~ ^(mainnet|testnet)-(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Expected a mainnet-vX.Y.Z or testnet-vX.Y.Z tag."
            exit 1
          fi
          network="${BASH_REMATCH[1]}"
          release=$(jq -ce --arg network "$network" '.[$network]' releases.json)
          jq -e '
            (.version | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            ([.controller, .grin, .grinpp] | all(.[];
              (.repository | test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")) and
              (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
              (.commit | test("^[0-9a-f]{40}$"))
            ))
          ' <<< "$release" > /dev/null
          version=$(jq -r '.version' <<< "$release")
          if [[ "$RELEASE_TAG" != "$network-$version" ]]; then
            echo "Release tag does not match releases.json."
            exit 1
          fi
          echo "network=$network" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sources=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    name: ${{ needs.release.outputs.network }} / ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout controller source
        uses: actions/checkout@v4
        with:
          repository: ${{ fromJSON(needs.release.outputs.sources).controller.repository }}
          ref: ${{ fromJSON(needs.release.outputs.sources).controller.commit }}
          path: controller-source
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Check release tag is unused
        env:
          RELEASE: ${{ needs.release.outputs.version }}
        run: |
          if docker buildx imagetools inspect "wiesche89/grin-node-runtime:$RELEASE" >/dev/null 2>&1; then
            echo "Release $RELEASE already exists; choose a new version."
            exit 1
          fi
      - name: Build Rust node
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.grin
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          tags: wiesche89/grin-builder:${{ needs.release.outputs.version }}-${{ matrix.platform.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            GRIN_REPO=https://github.com/${{ fromJSON(needs.release.outputs.sources).grin.repository }}.git
            GRIN_REF=${{ fromJSON(needs.release.outputs.sources).grin.commit }}
          cache-from: type=gha,scope=grin-${{ matrix.platform.arch }}-${{ needs.release.outputs.version }}
          cache-to: type=gha,mode=max,scope=grin-${{ matrix.platform.arch }}-${{ needs.release.outputs.version }}
      - name: Build Grin++ node
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.grinpp
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          tags: wiesche89/grinpp-builder:${{ needs.release.outputs.version }}-${{ matrix.platform.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            GRINPP_REPO=https://github.com/${{ fromJSON(needs.release.outputs.sources).grinpp.repository }}.git
            GRINPP_REF=${{ fromJSON(needs.release.outputs.sources).grinpp.commit }}
            GRINPP_VERSION=${{ fromJSON(needs.release.outputs.sources).grinpp.version }}
          cache-from: type=gha,scope=grinpp-${{ matrix.platform.arch }}-${{ needs.release.outputs.version }}
          cache-to: type=gha,mode=max,scope=grinpp-${{ matrix.platform.arch }}-${{ needs.release.outputs.version }}
      - name: Build controller
        uses: docker/build-push-action@v6
        with:
          context: controller-source
          file: Dockerfile.controller
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          tags: wiesche89/grin-node-controller-builder:${{ needs.release.outputs.version }}-${{ matrix.platform.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=controller-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=controller-${{ matrix.platform.arch }}
      - name: Assemble runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          target: runtime
          platforms: linux/${{ matrix.platform.arch }}
          load: true
          tags: wiesche89/grin-node-runtime:${{ needs.release.outputs.version }}-${{ matrix.platform.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            CONTROLLER_IMAGE=wiesche89/grin-node-controller-builder:${{ needs.release.outputs.version }}-${{ matrix.platform.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
            GRIN_IMAGE=wiesche89/grin-builder:${{ needs.release.outputs.version }}-${{ matrix.platform.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
            GRINPP_IMAGE=wiesche89/grinpp-builder:${{ needs.release.outputs.version }}-${{ matrix.platform.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check runtime
        env:
          IMAGE: wiesche89/grin-node-runtime:${{ needs.release.outputs.version }}-${{ matrix.platform.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          CONTROLLER_VERSION: ${{ fromJSON(needs.release.outputs.sources).controller.version }}
          GRIN_VERSION: ${{ fromJSON(needs.release.outputs.sources).grin.version }}
        run: |
          docker run --rm --network none --entrypoint /opt/nodes/grin-rust/grin "$IMAGE" --version | grep -F "$GRIN_VERSION"
          docker run --rm --network none "$IMAGE" --version | grep -Fx "grin-node-controller $CONTROLLER_VERSION"
          docker run --rm --network none --entrypoint /opt/nodes/grinpp/grin "$IMAGE" --help
          python3 tests/auth.py --image "$IMAGE"
      - name: Push checked runtime
        env:
          IMAGE: wiesche89/grin-node-runtime:${{ needs.release.outputs.version }}-${{ matrix.platform.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker push "$IMAGE"

  publish:
    needs: [release, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-arch runtime
        env:
          IMAGE: wiesche89/grin-node-runtime:${{ needs.release.outputs.version }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker buildx imagetools create --tag "$IMAGE" "$IMAGE-amd64-$RUN" "$IMAGE-arm64-$RUN"
          docker buildx imagetools inspect "$IMAGE"
